name: Quality & Compliance Check (CI)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Theme & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: 1. Lint Theme & Validate Slidev Rules
        run: npm run lint:theme

      - name: 2. Check Code & Slidev Formatting (Prettier)
        run: npm run format:check

      - name: 3. Lint Vue Layouts & Components (ESLint)
        run: npm run lint:vue

      - name: 4. Lint Theme CSS & Component Styles (Stylelint)
        run: npm run lint:css

      - name: 5. Check Vue & TypeScript Types (vue-tsc)
        run: npm run typecheck

      - name: 6. Build Slidev Presentation
        run: npm run build

      - name: Verify Build Artifacts
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "Error: dist/index.html was not generated."
            exit 1
          fi
          echo "Build artifact dist/index.html successfully verified."
